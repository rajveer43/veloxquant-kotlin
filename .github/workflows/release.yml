name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: macos-14
    # Gated behind a repo variable so an early clone/fork never attempts a real publish with
    # missing secrets (build-prompt bootstrap item 8). Flip vars.PUBLISH_TO_MAVEN_CENTRAL to
    # 'true' only after the maintainer has confirmed package coordinates and configured signing
    # secrets — see plan §9 item 2/item 5 and the build prompt's judgment-call gates.
    if: vars.PUBLISH_TO_MAVEN_CENTRAL == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
